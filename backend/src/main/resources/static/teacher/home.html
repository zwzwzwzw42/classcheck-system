<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师端 - 课堂学情监控管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .stat-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
        .stat-card { background: linear-gradient(135deg,#1e6fb8,#3aa0c8); color:#fff; border-radius:8px; padding:18px; text-align:center; }
        .stat-card.highlight { background: linear-gradient(135deg,#e8821e,#f0a93e); }
        .stat-card .num { font-size: 32px; font-weight: bold; }
        .stat-card .cap { font-size: 13px; opacity: .92; margin-top: 4px; }
        .emoji-dist { display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; margin: 12px 0; }
        .emoji-dist .item { text-align:center; border:1px solid #e3e9ef; border-radius:8px; padding:10px 4px; background:#fafcfe; }
        .emoji-dist .item .face { font-size:26px; }
        .emoji-dist .item .cnt { font-size:18px; font-weight:bold; color:#1e6fb8; }
        .emoji-dist .item .pct { font-size:11px; color:#8a99a8; }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .chart-box { height: 320px; }
        /* 课程班级三级管理 */
        .manage-grid { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 14px; align-items: start; }
        .manage-col { border: 1px solid #e3e9ef; border-radius: 8px; background: #fafcfe; min-height: 320px; }
        .manage-col .col-head {
            padding: 10px 12px; border-bottom: 1px solid #e3e9ef; display: flex;
            align-items: center; justify-content: space-between; gap: 6px; background: #f4f8fc;
            border-radius: 8px 8px 0 0;
        }
        .manage-col .col-head .t { font-size: 14px; font-weight: 600; color: #34506b; }
        .manage-col .col-body { padding: 8px; }
        .manage-item {
            display: flex; align-items: center; justify-content: space-between; gap: 6px;
            padding: 9px 10px; border: 1px solid #e3e9ef; border-radius: 6px; background: #fff;
            margin-bottom: 7px; cursor: pointer; font-size: 14px;
        }
        .manage-item:hover { border-color: #9cc3e6; }
        .manage-item.selected { border-color: #1e6fb8; background: #eaf3fb; box-shadow: 0 0 0 1px #1e6fb8 inset; }
        .manage-item .item-ops { display: flex; gap: 2px; flex-shrink: 0; }
        .manage-item .item-ops button { background: none; border: none; cursor: pointer; font-size: 13px; color: #1e6fb8; padding: 0 4px; }
        .manage-item .item-ops button.del { color: #c14747; }
        .col-placeholder { color: #a5b2bf; font-size: 13px; text-align: center; padding: 40px 10px; }
        .roster-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-bottom: 1px solid #eef2f6; font-size: 13px; }
        .roster-item:last-child { border-bottom: none; }
        .roster-item .who { display: flex; gap: 8px; align-items: center; }
        .roster-item .no { color: #8a99a8; font-size: 12px; min-width: 92px; }
        .student-pick-list { max-height: 380px; overflow-y: auto; border: 1px solid #e3e9ef; border-radius: 6px; padding: 6px 10px; }
        .student-pick { display: flex; align-items: center; gap: 8px; padding: 6px 2px; border-bottom: 1px solid #f0f4f8; font-size: 14px; }
        .student-pick:last-child { border-bottom: none; }
        .student-pick .meta { color: #8a99a8; font-size: 12px; }
        @media (max-width: 900px) { .stat-cards { grid-template-columns: 1fr; } .charts { grid-template-columns: 1fr; } .emoji-dist { grid-template-columns: repeat(3,1fr); } .manage-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="navbar" id="navbar"></div>
<div class="container">
    <div class="tabs">
        <div class="tab active" data-tab="stats" onclick="switchTab('stats')">实时学情统计</div>
        <div class="tab" data-tab="history" onclick="switchTab('history')">历史查询与导出</div>
        <div class="tab" data-tab="discuss" onclick="switchTab('discuss')">在线讨论</div>
        <div class="tab" data-tab="course" onclick="switchTab('course')">课程班级管理</div>
    </div>

    <!-- 实时统计 -->
    <div class="tab-panel active" id="panel-stats">
        <div class="card">
            <div class="toolbar">
                <label style="font-size:14px;">课程：</label>
                <select id="st-course" onchange="loadLatest()"></select>
                <button class="btn btn-sm" onclick="refreshStats()">立即统计</button>
                <span id="st-time" style="font-size:12px;color:#8a99a8;margin-left:auto;"></span>
            </div>

            <h3 style="background:#fff6e8;border-left-color:#e8821e;color:#c06a10;padding:8px 10px;border-radius:4px;">
                当前时段学情（显著展示）
            </h3>
            <div class="stat-cards">
                <div class="stat-card highlight"><div class="num" id="c-total">-</div><div class="cap">提交学生人数</div></div>
                <div class="stat-card"><div class="num" id="c-avg">-</div><div class="cap">班级平均分</div></div>
                <div class="stat-card"><div class="num" id="c-var">-</div><div class="cap">分数方差</div></div>
            </div>

            <h3>各分数（表情）分布</h3>
            <div class="emoji-dist" id="emoji-dist"></div>

            <div class="charts">
                <div class="card" style="margin-bottom:0;"><h3>柱状图：各分数人数</h3><div id="bar-chart" class="chart-box"></div></div>
                <div class="card" style="margin-bottom:0;"><h3>饼状图：分数分布占比</h3><div id="pie-chart" class="chart-box"></div></div>
            </div>
        </div>
    </div>

    <!-- 历史查询（任务6完善导出） -->
    <div class="tab-panel" id="panel-history">
        <div class="card">
            <h3>历史学情查询</h3>
            <div class="toolbar">
                <select id="h-course"></select>
                <input type="date" id="h-start">
                <span>至</span>
                <input type="date" id="h-end">
                <button class="btn btn-sm" onclick="loadHistory()">查询</button>
                <button class="btn btn-sm btn-success" onclick="exportExcel()">导出Excel</button>
            </div>
            <table class="data-table">
                <thead><tr>
                    <th>统计时间</th><th>课程</th><th>提交人数</th><th>平均分</th><th>方差</th>
                    <th>1分</th><th>2分</th><th>3分</th><th>4分</th><th>5分</th><th>6分</th>
                </tr></thead>
                <tbody id="history-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- 在线讨论 -->
    <div class="tab-panel" id="panel-discuss">
        <div class="card">
            <h3>在线讨论（师生互动）</h3>
            <div id="discuss-root"></div>
        </div>
    </div>

    <!-- 课程班级管理（拓展模块） -->
    <div class="tab-panel" id="panel-course">
        <div class="card">
            <h3>课程班级管理（自主拓展）：课程 → 班级 → 学生名单</h3>
            <div class="manage-grid">
                <!-- 课程列 -->
                <div class="manage-col">
                    <div class="col-head">
                        <span class="t">我的课程</span>
                        <button class="btn btn-sm btn-success" onclick="openCourseModal()">+ 新增</button>
                    </div>
                    <div class="col-body" id="course-col-body">
                        <div class="col-placeholder">加载中…</div>
                    </div>
                </div>
                <!-- 班级列 -->
                <div class="manage-col">
                    <div class="col-head">
                        <span class="t" id="class-col-title">班级</span>
                        <button class="btn btn-sm btn-success" id="add-class-btn" disabled onclick="openClassModal()">+ 新增</button>
                    </div>
                    <div class="col-body" id="class-col-body">
                        <div class="col-placeholder">请先在左侧选择一门课程</div>
                    </div>
                </div>
                <!-- 名单列 -->
                <div class="manage-col">
                    <div class="col-head">
                        <span class="t" id="roster-col-title">学生名单</span>
                        <button class="btn btn-sm btn-success" id="add-stu-btn" disabled onclick="openAddStudents()">+ 添加学生</button>
                    </div>
                    <div class="col-body" id="roster-col-body">
                        <div class="col-placeholder">请先选择一个班级</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 课程弹窗 -->
<div class="modal-mask" id="course-modal">
    <div class="modal">
        <h3><span id="course-modal-title">新增课程</span><button class="close" onclick="closeCourseModal()">&times;</button></h3>
        <div class="form-item"><label>课程名称 *</label><input type="text" id="cm-name" maxlength="100"></div>
        <div class="form-item"><label>课程简介</label><textarea id="cm-desc" rows="3" maxlength="255"></textarea></div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeCourseModal()">取消</button>
            <button class="btn" onclick="saveCourse()">保存</button>
        </div>
    </div>
</div>

<!-- 班级弹窗 -->
<div class="modal-mask" id="class-modal">
    <div class="modal">
        <h3><span id="class-modal-title">新增班级</span><button class="close" onclick="closeClassModal()">&times;</button></h3>
        <div class="form-item"><label>班级名称 *</label><input type="text" id="clm-name" maxlength="50"></div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeClassModal()">取消</button>
            <button class="btn" onclick="saveClass()">保存</button>
        </div>
    </div>
</div>

<!-- 添加学生弹窗 -->
<div class="modal-mask" id="student-modal">
    <div class="modal">
        <h3><span>添加学生到班级</span><button class="close" onclick="closeAddStudents()">&times;</button></h3>
        <p style="font-size:13px;color:#5a6b7d;margin-bottom:10px;">勾选要加入本班的学生（已在班级中的默认勾选并标注）：</p>
        <div class="student-pick-list" id="student-pick-list"></div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeAddStudents()">取消</button>
            <button class="btn" onclick="saveAddStudents()">保存</button>
        </div>
    </div>
</div>
<div id="toast"></div>

<script src="/js/echarts.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/discuss.js"></script>
<script>
    const EMOJI_FACES = ['😣','😕','😐','🙂','😊','😄'];
    const EMOJI_LABELS = ['完全没理解','理解较低','部分理解','基本理解','理解较好','完全理解'];
    let barChart = null, pieChart = null;

    (async function () {
        const user = await loadCurrentUser();
        if (!user) return;
        if (user.role !== 2) { location.href = roleHome(user.role); return; }
        renderNavbar(user);
        await loadCourseOptions();
        loadLatest();
        setInterval(loadLatest, 30000); // 30秒自动刷新当前时段
        initDiscussion(user);
        loadCourses();
    })();

    async function loadCourseOptions() {
        const r = await api('/api/courses');
        let html = '<option value="">默认课堂</option>';
        if (r.code === 0) r.data.forEach(c => html += '<option value="' + c.id + '">' + c.name + '</option>');
        document.getElementById('st-course').innerHTML = html;
        document.getElementById('h-course').innerHTML = html;
    }

    function currentCourseId() {
        const v = document.getElementById('st-course').value;
        return v ? Number(v) : null;
    }

    async function refreshStats() {
        const r = await api('/api/teacher/stats/refresh', { method: 'POST' });
        if (r.code === 0) { toast('统计完成', 'success'); loadLatest(); }
        else toast(r.message, 'error');
    }

    async function loadLatest() {
        const cid = currentCourseId();
        const url = '/api/teacher/stats/latest' + (cid !== null ? '?courseId=' + cid : '');
        const r = await api(url);
        if (r.code !== 0) { toast(r.message, 'error'); return; }
        const s = r.data;
        if (!s) {
            document.getElementById('c-total').textContent = '0';
            document.getElementById('c-avg').textContent = '-';
            document.getElementById('c-var').textContent = '-';
            document.getElementById('st-time').textContent = '暂无统计数据，请点击"立即统计"';
            document.getElementById('emoji-dist').innerHTML = '';
            renderCharts([0,0,0,0,0,0], 0);
            return;
        }
        const counts = [s.score1Count,s.score2Count,s.score3Count,s.score4Count,s.score5Count,s.score6Count];
        document.getElementById('c-total').textContent = s.totalCount;
        document.getElementById('c-avg').textContent = s.avgScore;
        document.getElementById('c-var').textContent = s.variance;
        document.getElementById('st-time').textContent = '统计时间：' + fmtTime(s.statTime);
        const total = s.totalCount || 0;
        document.getElementById('emoji-dist').innerHTML = counts.map((c,i) => {
            const pct = total ? (c/total*100).toFixed(0) : 0;
            return '<div class="item"><div class="face">' + EMOJI_FACES[i] + '</div>' +
                '<div class="cnt">' + c + '人</div><div class="pct">' + pct + '% · ' + (i+1) + '分</div></div>';
        }).join('');
        renderCharts(counts, total);
    }

    function renderCharts(counts, total) {
        if (!barChart) barChart = echarts.init(document.getElementById('bar-chart'));
        if (!pieChart) pieChart = echarts.init(document.getElementById('pie-chart'));
        barChart.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: EMOJI_LABELS.map((l,i)=>(i+1)+'分') },
            yAxis: { type: 'value', minInterval: 1 },
            series: [{ type: 'bar', data: counts, itemStyle: { color: '#1e6fb8' }, barWidth: '50%', label: { show: true, position: 'top' } }],
            grid: { left: 40, right: 20, top: 30, bottom: 30 }
        });
        const pieData = counts.map((c,i) => ({ name: (i+1)+'分 '+EMOJI_LABELS[i], value: c })).filter(d => d.value > 0);
        pieChart.setOption({
            tooltip: { trigger: 'item', formatter: '{b}: {c}人 ({d}%)' },
            legend: { bottom: 0, type: 'scroll' },
            series: [{ type: 'pie', radius: ['38%','62%'], center: ['50%','45%'], data: pieData,
                label: { formatter: '{b}\n{c}人' } }]
        });
    }

    async function loadHistory() {
        const cid = document.getElementById('h-course').value;
        const start = document.getElementById('h-start').value;
        const end = document.getElementById('h-end').value;
        let url = '/api/teacher/stats/history?';
        if (cid) url += 'courseId=' + cid + '&';
        if (start) url += 'startTime=' + encodeURIComponent(start + ' 00:00:00') + '&';
        if (end) url += 'endTime=' + encodeURIComponent(end + ' 23:59:59');
        const r = await api(url);
        const tbody = document.getElementById('history-tbody');
        if (r.code !== 0) { toast(r.message,'error'); return; }
        if (!r.data.length) { tbody.innerHTML = '<tr><td colspan="11">暂无历史数据</td></tr>'; return; }
        tbody.innerHTML = r.data.map(s => '<tr><td>' + fmtTime(s.statTime) + '</td><td>' + s.courseName + '</td>' +
            '<td>' + s.totalCount + '</td><td>' + s.avgScore + '</td><td>' + s.variance + '</td>' +
            '<td>'+s.score1Count+'</td><td>'+s.score2Count+'</td><td>'+s.score3Count+'</td>' +
            '<td>'+s.score4Count+'</td><td>'+s.score5Count+'</td><td>'+s.score6Count+'</td></tr>').join('');
    }

    function exportExcel() {
        const cid = document.getElementById('h-course').value;
        const start = document.getElementById('h-start').value;
        const end = document.getElementById('h-end').value;
        let url = '/api/teacher/stats/export?';
        if (cid) url += 'courseId=' + cid + '&';
        if (start) url += 'startTime=' + encodeURIComponent(start + ' 00:00:00') + '&';
        if (end) url += 'endTime=' + encodeURIComponent(end + ' 23:59:59');
        // 带 token 的文件下载
        fetch(url, { headers: { 'Authorization': 'Bearer ' + getToken() } })
            .then(res => {
                if (!res.ok) throw new Error('导出失败');
                // 从响应头解析后端生成的文件名
                const cd = res.headers.get('Content-Disposition') || '';
                const m = cd.match(/filename\*=UTF-8''([^;]+)/i);
                window.__exportName = m ? decodeURIComponent(m[1]) : '';
                return res.blob();
            })
            .then(blob => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                const now = new Date();
                const pad = n => String(n).padStart(2, '0');
                const fallback = '学情统计_' + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate())
                    + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds()) + '.xlsx';
                a.download = window.__exportName || fallback;
                a.click();
                URL.revokeObjectURL(a.href);
                toast('导出成功', 'success');
            }).catch(() => toast('导出失败，请稍后重试', 'error'));
    }

    // ============ 课程班级管理（拓展模块） ============
    let myCoursesList = [];
    let selCourse = null;
    let classesList = [];
    let selClass = null;
    let rosterList = [];
    let editingCourseId = null;
    let editingClassId = null;

    async function loadCourses() {
        const r = await api('/api/teacher/courses');
        const body = document.getElementById('course-col-body');
        if (r.code !== 0) { body.innerHTML = '<div class="col-placeholder">加载失败</div>'; return; }
        myCoursesList = r.data;
        if (!r.data.length) { body.innerHTML = '<div class="col-placeholder">还没有课程，点击右上角新增</div>'; return; }
        body.innerHTML = r.data.map(c =>
            '<div class="manage-item ' + (selCourse && selCourse.id === c.id ? 'selected' : '') + '" onclick="selectCourse(' + c.id + ')">' +
                '<span>' + escHtml(c.name) + '</span>' +
                '<span class="item-ops">' +
                    '<button title="编辑" onclick="event.stopPropagation();openCourseModal(' + c.id + ')">编辑</button>' +
                    '<button class="del" title="删除" onclick="event.stopPropagation();deleteCourse(' + c.id + ')">删除</button>' +
                '</span></div>').join('');
    }

    function escHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    async function selectCourse(id) {
        selCourse = myCoursesList.find(c => c.id === id);
        selClass = null;
        document.getElementById('add-class-btn').disabled = false;
        document.getElementById('class-col-title').textContent = '班级 · ' + selCourse.name;
        loadCourses(); // 刷新选中样式
        const r = await api('/api/teacher/courses/' + id + '/classes');
        const body = document.getElementById('class-col-body');
        if (r.code !== 0) { body.innerHTML = '<div class="col-placeholder">加载失败</div>'; return; }
        classesList = r.data;
        document.getElementById('add-stu-btn').disabled = true;
        document.getElementById('roster-col-body').innerHTML = '<div class="col-placeholder">请先选择一个班级</div>';
        document.getElementById('roster-col-title').textContent = '学生名单';
        if (!r.data.length) { body.innerHTML = '<div class="col-placeholder">该课程还没有班级</div>'; return; }
        body.innerHTML = r.data.map(c =>
            '<div class="manage-item" onclick="selectClass(' + c.id + ')">' +
                '<span>' + escHtml(c.name) + '</span>' +
                '<span class="item-ops"><button class="del" onclick="event.stopPropagation();deleteClass(' + c.id + ')">删除</button></span>' +
            '</div>').join('');
    }

    async function selectClass(id) {
        selClass = classesList.find(c => c.id === id);
        document.querySelectorAll('#class-col-body .manage-item').forEach((el, i) =>
            el.classList.toggle('selected', classesList[i].id === id));
        document.getElementById('add-stu-btn').disabled = false;
        document.getElementById('roster-col-title').textContent = '名单 · ' + selClass.name;
        await loadRoster();
    }

    async function loadRoster() {
        const r = await api('/api/teacher/classes/' + selClass.id + '/students');
        const body = document.getElementById('roster-col-body');
        if (r.code !== 0) { body.innerHTML = '<div class="col-placeholder">加载失败</div>'; return; }
        rosterList = r.data;
        if (!r.data.length) { body.innerHTML = '<div class="col-placeholder">名单为空，点击右上角添加</div>'; return; }
        body.innerHTML = r.data.map(u =>
            '<div class="roster-item"><span class="who">' +
                '<span class="no">' + escHtml(u.studentNo || '-') + '</span>' +
                '<span>' + escHtml(u.name) + '</span></span>' +
                '<button class="op-link danger" style="color:#c14747;" onclick="removeStudent(' + u.id + ')">移除</button>' +
            '</div>').join('');
    }

    // ---- 课程弹窗 ----
    function openCourseModal(id) {
        editingCourseId = id || null;
        document.getElementById('course-modal-title').textContent = id ? '编辑课程' : '新增课程';
        if (id) {
            const c = myCoursesList.find(x => x.id === id);
            document.getElementById('cm-name').value = c.name;
            document.getElementById('cm-desc').value = c.description || '';
        } else {
            document.getElementById('cm-name').value = '';
            document.getElementById('cm-desc').value = '';
        }
        document.getElementById('course-modal').classList.add('show');
    }
    function closeCourseModal() { document.getElementById('course-modal').classList.remove('show'); }
    async function saveCourse() {
        const name = document.getElementById('cm-name').value.trim();
        const description = document.getElementById('cm-desc').value.trim();
        if (!name) { toast('课程名称不能为空', 'error'); return; }
        const body = JSON.stringify({ name, description });
        const r = editingCourseId
            ? await api('/api/teacher/courses/' + editingCourseId, { method: 'PUT', body })
            : await api('/api/teacher/courses', { method: 'POST', body });
        if (r.code === 0) { toast(r.message, 'success'); closeCourseModal(); await loadCourses(); }
        else toast(r.message, 'error');
    }
    async function deleteCourse(id) {
        if (!confirm('删除该课程将同时删除其下所有班级与名单，确定吗？')) return;
        const r = await api('/api/teacher/courses/' + id, { method: 'DELETE' });
        if (r.code === 0) {
            toast(r.message, 'success');
            if (selCourse && selCourse.id === id) {
                selCourse = null;
                document.getElementById('class-col-body').innerHTML = '<div class="col-placeholder">请先在左侧选择一门课程</div>';
                document.getElementById('roster-col-body').innerHTML = '<div class="col-placeholder">请先选择一个班级</div>';
                document.getElementById('add-class-btn').disabled = true;
                document.getElementById('add-stu-btn').disabled = true;
            }
            loadCourses();
        } else toast(r.message, 'error');
    }

    // ---- 班级弹窗 ----
    function openClassModal() {
        editingClassId = null;
        document.getElementById('clm-name').value = '';
        document.getElementById('class-modal').classList.add('show');
    }
    function closeClassModal() { document.getElementById('class-modal').classList.remove('show'); }
    async function saveClass() {
        const name = document.getElementById('clm-name').value.trim();
        if (!name) { toast('班级名称不能为空', 'error'); return; }
        const body = JSON.stringify({ name, courseId: selCourse.id });
        const r = await api('/api/teacher/classes', { method: 'POST', body });
        if (r.code === 0) { toast(r.message, 'success'); closeClassModal(); selectCourse(selCourse.id); }
        else toast(r.message, 'error');
    }
    async function deleteClass(id) {
        if (!confirm('确定删除该班级及其学生名单关联吗？')) return;
        const r = await api('/api/teacher/classes/' + id, { method: 'DELETE' });
        if (r.code === 0) {
            toast(r.message, 'success');
            if (selClass && selClass.id === id) {
                selClass = null;
                document.getElementById('roster-col-body').innerHTML = '<div class="col-placeholder">请先选择一个班级</div>';
                document.getElementById('add-stu-btn').disabled = true;
            }
            selectCourse(selCourse.id);
        } else toast(r.message, 'error');
    }

    // ---- 添加学生 ----
    async function openAddStudents() {
        const [allRes, inRes] = await Promise.all([
            api('/api/teacher/students/all'),
            api('/api/teacher/classes/' + selClass.id + '/students')
        ]);
        if (allRes.code !== 0) return;
        const inIds = new Set(inRes.data.map(u => u.id));
        document.getElementById('student-pick-list').innerHTML = allRes.data.map(u => {
            const checked = inIds.has(u.id);
            return '<label class="student-pick"><input type="checkbox" value="' + u.id + '" ' +
                (checked ? 'checked' : '') + '> <span>' + escHtml(u.name) + '</span>' +
                '<span class="meta">' + escHtml(u.studentNo || '') + ' ' + escHtml(u.className || '') +
                (checked ? '（已在班）' : '') + '</span></label>';
        }).join('');
        document.getElementById('student-modal').classList.add('show');
    }
    function closeAddStudents() { document.getElementById('student-modal').classList.remove('show'); }
    async function saveAddStudents() {
        const ids = Array.from(document.querySelectorAll('#student-pick-list input:checked'))
            .map(cb => Number(cb.value));
        const r = await api('/api/teacher/classes/' + selClass.id + '/students', {
            method: 'POST', body: JSON.stringify({ studentIds: ids })
        });
        if (r.code === 0) { toast(r.message, 'success'); closeAddStudents(); loadRoster(); }
        else toast(r.message, 'error');
    }
    async function removeStudent(sid) {
        const r = await api('/api/teacher/classes/' + selClass.id + '/students/' + sid, { method: 'DELETE' });
        if (r.code === 0) { toast(r.message, 'success'); loadRoster(); }
        else toast(r.message, 'error');
    }
</script>
</body>
</html>
