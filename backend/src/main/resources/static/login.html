<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 课堂学情监控管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { background: linear-gradient(135deg, #1e6fb8 0%, #3aa0c8 100%); min-height: 100vh; }
        .login-wrap { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-box { background: #fff; border-radius: 12px; width: 400px; max-width: 100%; padding: 34px 36px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
        .login-box h1 { text-align: center; font-size: 21px; color: #1e6fb8; margin-bottom: 6px; }
        .login-box .subtitle { text-align: center; font-size: 13px; color: #8a99a8; margin-bottom: 22px; }
        .login-tabs { display: flex; border-bottom: 2px solid #e3e9ef; margin-bottom: 22px; }
        .login-tabs .ltab { flex: 1; text-align: center; padding: 10px 0; cursor: pointer; font-size: 14px; color: #5a6b7d; border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .login-tabs .ltab.active { color: #1e6fb8; border-bottom-color: #1e6fb8; font-weight: 600; }
        .login-panel { display: none; }
        .login-panel.active { display: block; }
        .login-box .btn { width: 100%; padding: 11px; font-size: 15px; margin-top: 6px; }
        .sms-row { display: flex; gap: 8px; }
        .sms-row input { flex: 1; }
        .sms-row button { white-space: nowrap; }
        .third-btns { display: flex; gap: 14px; justify-content: center; margin: 10px 0 18px; }
        .third-btn { width: 96px; padding: 12px 0; border: 1px solid #d3dde6; border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; }
        .third-btn:hover { border-color: #1e6fb8; background: #f0f7fd; }
        .third-btn .icon { font-size: 26px; display: block; margin-bottom: 4px; }
        .tip { font-size: 12px; color: #9aa8b5; text-align: center; margin-top: 16px; line-height: 1.7; }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-box">
        <h1>课堂学情监控管理系统</h1>
        <div class="subtitle">Class Learning Monitoring System</div>

        <div class="login-tabs">
            <div class="ltab active" data-ltab="password" onclick="switchLoginTab('password')">密码登录</div>
            <div class="ltab" data-ltab="sms" onclick="switchLoginTab('sms')">短信登录</div>
            <div class="ltab" data-ltab="third" onclick="switchLoginTab('third')">第三方登录</div>
        </div>

        <!-- 密码登录 -->
        <div class="login-panel active" id="lpanel-password">
            <div class="form-item">
                <label>用户名</label>
                <input type="text" id="p-username" placeholder="请输入用户名（如 student01）">
            </div>
            <div class="form-item">
                <label>密码</label>
                <input type="password" id="p-password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doPasswordLogin()">
            </div>
            <button class="btn" onclick="doPasswordLogin()">登 录</button>
        </div>

        <!-- 短信登录 -->
        <div class="login-panel" id="lpanel-sms">
            <div class="form-item">
                <label>手机号</label>
                <input type="text" id="s-phone" placeholder="请输入注册手机号">
            </div>
            <div class="form-item">
                <label>验证码</label>
                <div class="sms-row">
                    <input type="text" id="s-code" placeholder="6位验证码">
                    <button class="btn btn-ghost btn-sm" id="sms-btn" onclick="sendSms()">获取验证码</button>
                </div>
            </div>
            <button class="btn" onclick="doSmsLogin()">登 录</button>
        </div>

        <!-- 第三方登录（模拟） -->
        <div class="login-panel" id="lpanel-third">
            <div class="third-btns">
                <button class="third-btn" onclick="doThirdLogin('wechat')">
                    <span class="icon" style="color:#37a66a;">●</span>微信
                </button>
                <button class="third-btn" onclick="doThirdLogin('qq')">
                    <span class="icon" style="color:#1e6fb8;">●</span>QQ
                </button>
            </div>
            <div class="form-item">
                <label>授权绑定手机号（模拟第三方授权后获取）</label>
                <input type="text" id="t-phone" placeholder="请输入账号绑定的手机号">
            </div>
            <button class="btn" onclick="doThirdLoginConfirm()">模拟授权并登录</button>
        </div>

        <div class="tip">
            测试账号（密码均为 123456）：<br>
            学生 student01 ｜ 教师 teacher01 ｜ 管理员 admin
        </div>
    </div>
</div>
<div id="toast"></div>

<script src="/js/common.js"></script>
<script>
    // 已登录则直接跳转
    if (getToken()) {
        api('/api/auth/me').then(r => { if (r.code === 0) location.href = roleHome(r.data.role); });
    }

    let thirdPlatform = 'wechat';

    function switchLoginTab(name) {
        document.querySelectorAll('.login-tabs .ltab').forEach(t => t.classList.toggle('active', t.dataset.ltab === name));
        document.querySelectorAll('.login-panel').forEach(p => p.classList.toggle('active', p.id === 'lpanel-' + name));
    }

    function afterLogin(data) {
        setToken(data.token);
        toast('登录成功，欢迎 ' + data.user.name, 'success');
        setTimeout(() => location.href = roleHome(data.user.role), 600);
    }

    async function doPasswordLogin() {
        const username = document.getElementById('p-username').value.trim();
        const password = document.getElementById('p-password').value.trim();
        if (!username || !password) { toast('请输入用户名和密码', 'error'); return; }
        const r = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
        if (r.code === 0) afterLogin(r.data); else toast(r.message, 'error');
    }

    let smsCountdown = 0;
    async function sendSms() {
        const phone = document.getElementById('s-phone').value.trim();
        if (!phone) { toast('请输入手机号', 'error'); return; }
        const btn = document.getElementById('sms-btn');
        const r = await api('/api/auth/sms/send', { method: 'POST', body: JSON.stringify({ phone }) });
        if (r.code !== 0) { toast(r.message, 'error'); return; }
        toast('验证码已发送（模拟）：' + r.data, 'success');
        smsCountdown = 60;
        btn.disabled = true;
        const timer = setInterval(() => {
            smsCountdown--;
            btn.textContent = smsCountdown > 0 ? smsCountdown + 's后重发' : '获取验证码';
            if (smsCountdown <= 0) { clearInterval(timer); btn.disabled = false; }
        }, 1000);
    }

    async function doSmsLogin() {
        const phone = document.getElementById('s-phone').value.trim();
        const code = document.getElementById('s-code').value.trim();
        if (!phone || !code) { toast('请输入手机号和验证码', 'error'); return; }
        const r = await api('/api/auth/sms/login', { method: 'POST', body: JSON.stringify({ phone, code }) });
        if (r.code === 0) afterLogin(r.data); else toast(r.message, 'error');
    }

    function doThirdLogin(platform) {
        thirdPlatform = platform;
        switchLoginTab('third');
        toast('请确认' + (platform === 'wechat' ? '微信' : 'QQ') + '授权（模拟）', 'info');
    }

    async function doThirdLoginConfirm() {
        const phone = document.getElementById('t-phone').value.trim();
        if (!phone) { toast('请输入绑定手机号', 'error'); return; }
        const r = await api('/api/auth/third/login', { method: 'POST', body: JSON.stringify({ platform: thirdPlatform, phone }) });
        if (r.code === 0) afterLogin(r.data); else toast(r.message, 'error');
    }
</script>
</body>
</html>
